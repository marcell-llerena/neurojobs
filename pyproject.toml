[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurojobs"
version = "0.1.0"
description = "A Telegram bot that helps users discover job postings and get personalized job recommendations using AI-powered resume matching and web scraping"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "aiometer>=1.0.0",
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.4.1",
    "emoji>=2.15.0",
    "fake-headers>=1.0.2",
    "langchain>=1.2.7",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "loguru>=0.7.3",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.7",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "tenacity>=9.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurojobs"]

[tool.hatch.build.targets.wheel.force-include]
"src/neurojobs/prompts" = "neurojobs/prompts"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ty>=0.0.14",
]
